name: ${PROJECT_NAME}
services:
  develop:
    hostname: develop
    build:
      context: .
      dockerfile: ./docker/dev/app.Dockerfile
      args:
        - DEV_CONTAINER_UID=${DEV_CONTAINER_UID}
        - DEV_CONTAINER_GID=${DEV_CONTAINER_GID}
    volumes:
      - ".:/home/dev/code"
      - ".devcontainer/.bash_history:/home/dev/.bash_history"
    env_file:
      - ./.env
    ports:
      - 3000:3000
      - 5555:5555
    depends_on:
      - dentalmanagementsystem_db

  dentalmanagementsystem_db:
    image: postgres:17
    env_file:
      - ./.env
    volumes:
      - dentalmanagementsystem_db:/var/lib/postgresql/data

volumes:
  dentalmanagementsystem_db: {}
